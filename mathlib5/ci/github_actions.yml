name: MATHLIB5 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt 2>/dev/null || true

    - name: Build FOL Checker
      run: |
        gcc -std=c99 -pedantic -Wall -Wextra -O2 \
            layers/fol/src/fol_resolution_checker.c \
            -o layers/fol/src/fol_check

    - name: Build QF_LRA Solver
      run: |
        gcc -std=c99 -pedantic -Wall -Wextra -O2 -lm \
            malice_layer2/solver/qf_lra_solver.c \
            -o malice_layer2/solver/qf_lra_solver

    - name: Run Test Suite
      run: python test/run_all.py

    - name: Verify FOL Proofs
      run: |
        for f in layers/fol/test/*.proof; do
          echo "Verifying $f..."
          ./layers/fol/src/fol_check "$f" || exit 1
        done

    - name: Verify QF_LRA Constraints
      run: |
        for f in malice_layer2/solver/test_*.lp; do
          echo "Checking $f..."
          ./malice_layer2/solver/qf_lra_solver "$f" || true
        done

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker Image
      run: |
        docker build -t mathlib5:latest .

    - name: Test Docker Image
      run: |
        docker run --rm mathlib5:latest python test/run_all.py
