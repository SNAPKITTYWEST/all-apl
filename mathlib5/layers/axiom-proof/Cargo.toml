[package]
name = "axiom-proof"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Sovereign proof assistant. Faster than Lean 4. Verifiable by design."

[lib]
name = "axiom"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true

[profile.release]
opt-level = 3
lto = true
